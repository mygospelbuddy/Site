<!--
  _includes/head-shared.html

  Shared <head> content for every page on the site: charset/viewport,
  favicon, fonts, stylesheets, and the vendor/site scripts. This is
  included via each page's YAML as `includes: in_header:`.

  This file intentionally does NOT contain <title> or Open Graph/Twitter
  meta tags — those are page-specific and belong in each page's own .Rmd,
  in a `header-includes:` block in the YAML front matter, e.g.:

    header-includes:
      - '<meta property="og:title" content="Page Title">'
      - '<meta property="og:description" content="One sentence about this page.">'
      - '<meta property="og:image" content="https://www.mygospelbuddy.com/assets/img/some-image.png">'
      - '<meta property="og:url" content="https://www.mygospelbuddy.com/path/">'

  That keeps the shared look in ONE place while letting every page have
  its own unique link-preview image/title/description.

  This file also intentionally does NOT contain <!DOCTYPE>, <html>, <head>,
  or <body> tags — those are provided once by the page itself (pandoc).
  Including full documents-within-documents here was the cause of the
  invalid/duplicated markup in the old header.html/header2.html files.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" href="/assets/img/gospel-buddy-icon.png" type="image/png">
<link href="https://fonts.googleapis.com/css?family=Roboto:300,400,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="/assets/vendor/themify-icons/themify-icons.css">
<link rel="stylesheet" href="/assets/vendor/highlight/hybrid.css">
<link rel="stylesheet" href="/assets/css/articles.style.min.css" media="screen">
<link rel="stylesheet" href="/assets/css/site.css">

<script src="/assets/vendor/jquery/projects.jquery-1.12.4.js"></script>
<script src="/assets/vendor/jquery/projects.jquery-ui.js"></script>
<script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/assets/vendor/match-height/jquery.matchHeight-min.js"></script>
<script src="/assets/vendor/highlight/highlight.pack.js"></script>
<script>
  hljs.initHighlightingOnLoad();
</script>
