<!--
  _includes/footer.html

  The single, canonical footer for the whole site. Included on every page
  via `includes: after_body:` in each page's YAML.

  Fixed from the old docs/footer.html: this used to also contain its own
  <!DOCTYPE html><html>...<body> wrapper, which — combined with the old
  header.html doing the same thing on the other end of the page — produced
  invalid, triple-nested HTML documents. This file now contains only the
  fragment that actually belongs at the end of <body>.
-->
<footer class="section pb-4">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8 text-md-left text-center">
        <p class="mb-md-0 mb-4">My Gospel Buddy &copy;</p>
      </div>
      <div class="col-md-4 text-md-right text-center">
        <ul class="list-inline">
          <li class="list-inline-item"><a class="text-color d-inline-block p-2" href="https://www.instagram.com/mygospelbuddy"><i class="ti-instagram"></i></a></li>
        </ul>
      </div>
    </div>
  </div>
</footer>
<script src="/assets/js/script.min.js"></script>
